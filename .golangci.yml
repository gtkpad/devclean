run:
  timeout: 5m
  go: "1.25"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    - misspell
  disable:
    - exhaustruct
    - wrapcheck
    - prealloc

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
    disabled-checks:
      - hugeParam
      - rangeValCopy
  misspell:
    locale: US
    ignore-words:
      - editores

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gocritic

